name: Auto-Link PBI to Pull Request

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  link-pbi:
    runs-on: ubuntu-latest
    
    steps:
      - name: Extract PBI Number from Branch Name
        id: extract-pbi
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          echo "Branch name: $BRANCH_NAME"
          
          # Regex to match pattern: feature/405604-Description or bug/strategic-2/405604-Description
          if [[ $BRANCH_NAME =~ ^(feature|bug)(/strategic-2)?/([0-9]+)-(.+)$ ]]; then
            PBI_NUMBER="${BASH_REMATCH[3]}"
            BRANCH_TYPE="${BASH_REMATCH[1]}"
            DESCRIPTION="${BASH_REMATCH[4]}"
            echo "pbi_number=$PBI_NUMBER" >> $GITHUB_OUTPUT
            echo "branch_type=$BRANCH_TYPE" >> $GITHUB_OUTPUT
            echo "✅ Extracted PBI: $PBI_NUMBER from $BRANCH_TYPE branch"
          else
            echo "ℹ️ Branch name doesn't match expected pattern. Skipping PBI linkage."
            exit 0
          fi
      
      - name: Link PBI to PR using GitHub Azure Boards Integration
        if: steps.extract-pbi.outputs.pbi_number
        uses: actions/github-script@v7
        with:
          script: |
            const pbiNumber = '${{ steps.extract-pbi.outputs.pbi_number }}';
            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `AB#${pbiNumber}\n\n✅ Successfully linked Work Item AB#${pbiNumber} to this Pull Request`
              });
              console.log(`✅ Successfully linked Work Item AB#${pbiNumber} to PR #${context.issue.number}`);
            } catch (error) {
              console.error('❌ Failed to post comment:', error);
              core.setFailed(`Unable to post comment: ${error.message}`);
            }
